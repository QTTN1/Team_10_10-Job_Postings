# Start the API:            docker compose up --build
# Check Supabase from Docker: docker compose run --rm check-db
# The database is hosted on Supabase, so there is no database container.
services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  check-db:
    build: .
    env_file: .env
    command: python -m scripts.check_supabase
    profiles: ["tools"]

  # frontend:   # React app (add once frontend/ exists)
  #   build: ./frontend
  #   ports: ["3000:3000"]
  #   depends_on: [api]
